name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependances
        run: |
          for f in $(find . -name "*.txt" -not -path "./.git/*"); do
            echo "===== Scan de $f ====="
            tmp=$(mktemp -d)
            cp "$f" "$tmp/requirements.txt"
            docker run --rm -v "$tmp":/project \
              aquasec/trivy:latest fs --severity HIGH,CRITICAL /project/requirements.txt
            rm -rf "$tmp"
          done
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - uses: actions/checkout@v4
      - name: Test Dockerfile
        run: |
          echo "===== Hadolint ====="
          docker run --rm -i hadolint/hadolint < Dockerfile || true
          echo "===== Trivy config ====="
          docker run --rm -v "$PWD":/project aquasec/trivy:latest config /project
          echo "===== Trivy image ====="
          docker build -t imgvulne:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL imgvulne:ci
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "ecrire ici le scrypt de deploiement"
